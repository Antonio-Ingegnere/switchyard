[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchyard-runtime"
version = "2.2.0"
description = "Deterministic bounded delivery and human QA control plane"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.3,<7"]

[project.scripts]
switchyard = "switchyard.cli:main"

[tool.setuptools]
py-modules = ["flow_config"]

[tool.setuptools.packages.find]
include = ["switchyard*", "runtime*", "examples*"]

[tool.setuptools.package-data]
"examples" = ["**/*.yaml", "**/*.json", "**/*.md"]
