id: V2-002
status: blocked_pending_runtime_prerequisites
updated_by: RUNTIME-V2-C
goal: |
  Compile corrected v2 bundles to existing runtime plans after generic outcome,
  budget-routing and exact local/run accounting prerequisites are implemented.
scope:
  - docs/plans/v2-002-workflow-compiler.yaml (audit only; compiler not implemented)
constraints:
  - No runtime, Event, executor, v1, observability, delivery or Adeo changes here.
  - No hidden semantic retries, fake budget outcomes, approximate counters or provider calls.
  - Do not commit a compiler implementation with unresolved capability gaps.
contract_correction: |
  V2-001A removes role budget, max_total_invocations, max_escalations and all duration
  budgets. Routing reuse must not accidentally share execution allowances. No shared
  named scope is introduced. State max_invocations covers its rungs across one run;
  state max_state_visits counts logical entries. Rung max_invocations is local to
  that logical state/rung across visits, default one. Run invocation/visit caps are
  whole-run totals, not repeated per-state limits. All provided limits are positive ints.
execution_completeness: |
  Resolved declaratively by V2-001A: ladder-bearing states require an existing
  escalation_exhausted target; executable targets are permitted and reachability
  includes the edge. Non-ladder states and terminals forbid the field. No fallback
  destination is invented by Python. Semantic outcome names remain declarative.
proposed_precedence: |
  Match only the immediately next rung. A matching permitted escalation takes
  precedence, otherwise normal state on applies, otherwise a recognized escalation
  trigger in a ladder-bearing state uses escalation_exhausted. No skipping. Unknown
  unhandled outcomes are errors. Control-plane refusal/admission must distinguish
  rung limits from enclosing state/run limits: exhaustion cannot authorize work over
  an enclosing cap. Generic refusal/error policy belongs to RUNTIME-V2-B/C.
budget_capability_mapping:
  - field: state.max_invocations
    classification: SUPPORTED EXACTLY
    reason: Attach the same InvocationBudgetScope(name, limit) to every compiled state belonging to that logical state.
  - field: state.max_state_visits
    classification: SUPPORTED EXACTLY
    reason: |
      State.max_state_visits_per_run on the logical entry state counts entries;
      the compiler must direct normal logical transitions to that state and avoid
      re-entering it on internal hops. This remains independent of invocation scopes.
  - field: rung.max_invocations
    classification: SUPPORTED EXACTLY
    reason: Unique InvocationBudgetScope per logical state/rung, alongside any shared logical-state scope.
  - field: run.max_invocations
    classification: SUPPORTED EXACTLY
    reason: Flow.max_invocations_per_run admits only that many executable invocations; terminals consume none.
  - field: run.max_state_visits
    classification: UNSUPPORTED
    reason: |
      Whole-run logical-entry cap, including terminal entry, has no runtime equivalent.
      Do not approximate with sums of per-state limits or count internal rung hops.
remaining_compiler_prerequisites:
  - Exact whole-run logical-entry admission cap remains a separate runtime design task.
  - |
    Cycle validation intentionally still requires visit-bounded admission on cycles.
    Invocation/run caps do not authorize new cyclic graphs in RUNTIME-V2-C. Supporting
    v2 run-cap-only cyclic flows requires a separately reviewed validation extension.
removed_requirements:
  - No shared role invocation/escalation accounting.
  - No rung, role or run duration/deadline enforcement.
  - No provider-specific budget semantics.
prerequisites:
  RUNTIME-V2-A: |
    Implemented: current-state-declared outcomes replace the global runtime whitelist.
    Exact nonempty strings without NUL are accepted only when declared by the state;
    budget_exceeded remains reserved. Existing technical adapters/v1 YAML retain their
    behavior. Event fields unchanged; historical reader accepts valid semantic strings.
    Undeclared results fail before invocation_finished. No compiler is implemented.
  RUNTIME-V2-B: |
    Implemented: explicit budget refusal may target an executable state. Targets
    undergo ordinary admission and use their own refusal routes. Validation rejects
    cycles that bypass bounded admission, including pure refusal and mixed cycles.
    No executor may synthesize refusal. Event order/schema and accounting unchanged.
  RUNTIME-V2-C: |
    Implemented: Flow.max_invocations_per_run and immutable InvocationBudgetScope
    declarations in State.invocation_budgets. Invocation checks are atomic; precedence
    is existing state visits, then run invocations, then named scopes in declaration
    order. Budget refusal uses the state's own route without allocating IDs or
    consuming capacity. New metrics retain already-consumed observed semantics.
    No role/provider semantics, new Event fields, duration enforcement or whole-run
    visit cap. Existing static cycle rules are not relaxed. Compiler remains blocked
    on the explicit remaining prerequisites above.
proposed_public_api: |
  Not implemented: compile_workflow(bundle, flow_name, executor_resolver) -> CompiledWorkflow.
  Resolver is Callable[[ResolvedInvocation], Executor]. Frozen binding carries
  flow_name, logical_state, role_name, profile_name, provider, model, effort,
  rung_index, escalation_kind and context_mode (initial/continue/fresh).
  Frozen CompiledWorkflow contains Flow, read-only executors and read-only steps
  mapping runtime-state IDs to logical identity/binding and consumes/produces tuples.
  Terminal metadata has no invocation binding. Event schema need not change for
  logical identity: consumers use this external mapping. Deterministic IDs use a
  reserved namespace forbidden by logical identifiers, not parsed business semantics.
  Vertical continue and horizontal fresh are policy only until V2-003; no fabricated
  history sharing or artifact transport. Compiler errors use WorkflowCompileError;
  loader schema errors continue using FlowConfigError.
acceptance:
  - Future fake executions prove explicit rungs, adjacent matching, effort/context and exact caps.
  - Existing v1, runtime, recording, observability and presets retain behavior.
verification:
  - V2-001A loader regression tests validate the corrected declarative contract.
  - Existing full offline suite; compiler tests wait for the remaining prerequisites above.
non_goals:
  - Compiler or prerequisite implementation, duration budgets, role counters, artifacts or Adeo migration.
historical_audit_evidence_before_runtime_v2_a:
  - "Nonterminal budget target -> FlowValidationError: budget target must be terminal: a"
  - "inconclusive transition -> FlowValidationError: invalid outcome: inconclusive"
  - "inconclusive executor response -> ExecutionError: executor returned a malformed result"
