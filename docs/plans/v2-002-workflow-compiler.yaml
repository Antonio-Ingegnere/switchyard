id: V2-002
status: implemented_and_verified
goal: |
  Compile a selected validated WorkflowBundle flow to ordinary runtime states,
  executors and immutable metadata with explicit bounded invocation attempts.
scope:
  - switchyard/workflow_compiler.py
  - tests/test_workflow_compiler.py
  - docs/plans/v2-002-workflow-compiler.yaml
  - docs/design/workflow-bundle-v2.md
  - README.md
constraints:
  - No runtime, Event, executor API, recorder, observability, loader or existing preset changes.
  - No hidden retries, compiler accounting, provider branches or real provider calls.
  - No artifact/context transport, CLI, Adeo migration or V2-003 implementation.
prerequisite_audit:
  RUNTIME-V2-A: State-declared semantic outcomes; budget_exceeded reserved.
  RUNTIME-V2-B: Ordinary executable budget targets with conservative cycle validation.
  RUNTIME-V2-C: Atomic run and named-scope invocation accounting.
  RUNTIME-V2-D: Independent run, visit and exact scope routes with legacy fallback.
  RUNTIME-V2-E: State visits committed before invocation admission; refusal closes visit.
  remaining_required_runtime_prerequisites: []
  prior_blockers: |
    Cause routing and combined admission findings are documented in the D/E MicroSpecs.
    The compiled two-phase test replays entry invocation refusal followed by an alternate
    state; two logical entries are counted and the third is refused by the visit cap.
budget_capability_mapping:
  state_max_invocations: SUPPORTED EXACTLY (shared scope and state budget route)
  state_max_state_visits: SUPPORTED EXACTLY (entry-only visit cap and state budget route)
  rung_max_invocations: SUPPORTED EXACTLY (unique scope and adjacent/normal/exhaustion route)
  run_max_invocations: SUPPORTED EXACTLY (Flow cap and terminal flow route)
  removed: Whole-run visits, shared-role counters and duration budgets are not in the DSL.
final_implementation_design:
  compiler_api: |
    switchyard.workflow_compiler.compile_workflow(bundle, flow_name, executor_resolver)
    returns frozen CompiledWorkflow(flow, executors, plan, entry_states).
    Executors, plan and logical-entry mapping are defensive read-only mappings.
  resolver_api: |
    Callable[[ExecutionBinding], Executor], called once per executable compiled state
    during compilation, in sorted logical-state order then ascending rung order.
    No provider branches or real adapter construction. Resolution failures and invalid
    runtime representation raise WorkflowCompileError; unknown flow retains bundle.flow's
    existing FlowConfigError. No execution occurs during compilation.
  binding: |
    Frozen ExecutionBinding(flow_name, logical_state, role_name, rung_index,
    profile_name, provider, model, effort, escalation_kind, context_mode).
    Primary kind/context are None; later values copy the declared step exactly.
  inspection: |
    plan maps runtime state ID to frozen CompiledStatePlan(logical_state, binding,
    declaration, state). binding is None for terminals. declaration is the immutable
    source WorkflowStateSpec, preserving artifacts, local budgets and logical targets.
    state is the exact compiled runtime State, exposing transitions and budget routes.
    entry_states maps each logical name to its entry runtime ID. Terminal IDs retain
    original names. Consumers use mappings, never parse generated names.
  identifiers: |
    Executable IDs use @v2:<flow>:<logical>:<index>; executor IDs use the same unique
    key in their separate namespace. Scope names use @v2-scope:<flow>:<logical>:state
    and @v2-scope:<flow>:<logical>:rung:<index>. V2 names exclude @ and colon, making
    this deterministic encoding collision-safe. Check collisions explicitly; formatting
    is private and not a semantic API. All logical states are compiled independently.
  routing: |
    Next adjacent incoming trigger wins, then normal logical on, then recognized
    trigger exhaustion for ladder-bearing states. No forward search. Non-ladder
    unhandled trigger remains undeclared. budget_exceeded is excluded from semantic
    transitions and used only for the rung scope route by the same precedence.
    An unhandled non-ladder rung refusal leaves route None (existing runtime error).
  budgets: |
    Run cap/route -> Flow fields. Entry-only visit cap/route -> State fields.
    State invocation cap/route -> shared named scope attached first to every rung.
    Declared/default rung cap -> unique scope attached second, with local exhaustion
    route. Terminal targets preserve names; executable logical targets map to entry.
    Use E two-phase admission; never implement counters, routing loops or synthetic work.
  compatibility: |
    All identified mandatory primitives are available. Existing runtime graph validation
    remains authoritative; unrepresentable graphs produce explicit compilation errors,
    not invented caps or relaxed validation. Canonical YAML actually uses ready for
    IMPLEMENT/REPAIR_ONCE/FIX; tests follow YAML rather than illustrative done labels.
acceptance:
  - Canonical feature and bugfix execute through runtime.run with fake executors only.
  - Resolver receives exact provider/model/effort and primary/continue/fresh metadata.
  - Each rung executes as a separate invocation; role reuse creates independent identities.
  - Adjacent escalation wins, normal transitions next, recognized exhaustion last; no skipping.
  - Run/state/local budget causes use distinct routes; shared scope precedes local scope.
  - Compiled entry cap retains invocation-refused visits and stops further logical entries.
  - Immutable deterministic plans expose source artifacts and actual runtime targets/budgets.
  - Explicit errors for resolver, collision and runtime representation failures.
verification:
  - Focused fake-only compiler tests for paths, budgets, identity, errors and observability.
  - V2 loader, runtime A/B/C/D/E, V1, observability and delivery via full offline suite.
non_goals:
  - Real adapters, provider flags, context construction, durable handoffs, dashboards or CLI.
verification_results:
  focused: "19 compiler tests passed, with parameterized canonical feature/bugfix and budget scenarios."
  full_offline: "347 tests run: 346 passed, one existing platform skip (22.793 seconds)."
  command: ".venv/bin/python -m unittest discover -s tests -v"
  regressions: "V2 loader, runtime A/B/C/D/E, V1 loader, observability, diagnostics, timing, recorder, CLI and delivery included."
  execution_proof: "Canonical feature straight/vertical/exhaustion paths and bugfix straight/vertical/horizontal/rediagnosis paths pass. Real budget refusal and logical entry counting verified through compilation."
  protected_scope: "Runtime, Event, loaders, executors, recorder, observability and existing presets untouched. No artifact transport, real provider calls or Adeo changes."
