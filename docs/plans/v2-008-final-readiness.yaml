readiness:
  declaration: Switchyard V2 is internally complete for bounded single-work-item FEATURE and BUGFIX delivery, cross-provider escalation, deterministic verification, durable context, manual QA, safe acceptance and reopen lifecycle. No known internal prerequisite remains before consumer migration.
  limitations: No successful provider command-tool telemetry, no automatic provider retry, no push, no runtime crash-resume, cooperative exclusive Git/workspace access, existing provider capability matrices and manual partial-state recovery; accepted local test deviations remain explicit.
  frozen: Canonical workflow configuration, provider behavior, runtime/Event, V1/DELIVERY-001 compatibility and historical evidence.
  consumer_boundary: Migration supplies project workflow/configuration, local executables/aliases, durable event recording, isolated worktree ownership and human authorization; not another internal engine prerequisite.
  stop: Adeo untouched; no V2-009 begun.
