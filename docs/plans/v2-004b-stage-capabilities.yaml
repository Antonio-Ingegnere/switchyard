    - Installed binary identifiers checked as discovery hints only, not treated as documented configuration support.
    - Official configuration reference confirms shell_tool and unified_exec, not an independent CLI repository read/search mapping.
  protocol_evidence: /tmp/switchyard-v2-004b-protocol
  finding: No verified supported mapping for explicit repo_read without command access through the existing Codex exec adapter.
  uncertainty: This does not prove the absence of every internal capability; undocumented binary identifiers are insufficient for an enforceable public adapter contract.
  required_decision: |
    Obtain a supported independent read/search control, or explicitly authorize a
    provider support matrix that rejects unrepresentable capability combinations
    before invocation. Do not silently treat repo_read as permission for commands.
    The current task explicitly requires stopping when exact safe mapping cannot
    be established, so no partial Claude-only implementation was started.
  implementation: None.
  provider_calls: 0
  verification: MicroSpec validation and diff whitespace checks only; full offline suite not rerun because executable code and tests are unchanged.

approved_support_matrix:
  decision: Exact positive grants; unsupported provider combinations fail during eager resolution.
  omission: None preserves legacy provider defaults; explicit empty tuple means no tools.
  canonical_order: [repo_read, repo_write, command]
  dependencies: Loader requires repo_read whenever repo_write or command is declared.
  claude: Empty, read, read/write, read/command and read/write/command map to explicit built-in tools and permissions.
  codex: Empty disables shell with read-only sandbox; read/command uses read-only shell; all three use workspace-write shell. Other explicit combinations fail.
  command_states: Any explicit capabilities rejected if any rung uses provider command; terminals reject the field.
  error: ProviderResolutionError includes flow, logical state, rung, provider and requested capabilities.
  scope: Provider-native tools only; no claim of universal filesystem/network containment.

implementation_result:
  api: WorkflowStateSpec.capabilities and ExecutionBinding.capabilities are optional canonical immutable tuples; None differs from ().
  loader: Strict vocabulary, duplicate/type checks and read prerequisite; command-provider states and terminals reject the field.
  compiler: Transports the exact state policy to every rung without changing runtime routing or budgets.
  provider: Claude exact tool/permission lists; Codex explicit support matrix with pre-invocation rejection of unsupported combinations.
  canonical: Eleven model states declare explicit least-privilege capabilities; deterministic verifier states omit them.
  compatibility: Omission retains legacy policy; synthetic cross-provider output-schema test now explicitly requests no tools.
  verification:
    new_capability_tests: 6 passed.
    focused: 131 passed, including 4 V2-005 offline regressions.
    full_offline: 434 tests in 34.131 seconds; 432 passed, 1 unchanged known local SIGKILL failure, 1 existing platform skip; zero new failures.
    baseline_test: test_codex_repair.CodexRepairTests.test_exact_prompts_real_fake_cli_and_fresh_inputs remains unchanged and enabled.
    microspecs: Existing validator and git diff whitespace checks passed.
  limitations: Offline fake-process tests verify configured provider controls; no live tool execution proof or complete OS/network containment claim.
  protected_scope: Runtime/Event, artifact persistence, StageOutputContract, budgets, transitions and fresh/continue unchanged; no real provider calls or Adeo changes.
  completion: V2-004B complete; V2-006 live attempts remain pending.
