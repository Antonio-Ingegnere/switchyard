id: V2-004B
goal: Declare provider-neutral stage capabilities and enforce them through provider adapters.
status: complete
scope:
  - Audit installed Claude and Codex tool permission mechanisms before implementation.
  - Planned optional state capabilities transported through immutable ExecutionBinding metadata.
constraints:
  - No runtime, Event, artifact, handoff, budget or routing changes.
  - No real provider invocations, Adeo changes or V2-006 live attempts.
  - Stop before implementation if an exact safe Codex mapping cannot be established.
acceptance:
  - Explicit capabilities do not silently grant undeclared tools.
  - Canonical reproduction can run commands without enabling dedicated edit/write tools.
  - Reasoning-only stages have repository read tools without command tools.
  - Existing V2-005 behavior remains available and offline suite has no new failures.
verification:
  - Local claude --help and --version; codex --help, exec --help, features list and --version.
  - Official Codex configuration reference checked for shell and independent repository tool controls.
  - No executable implementation or capability tests until the mapping prerequisite is resolved.
non_goals:
  - New tool framework, custom repository MCP server, sandbox invention or provider-only behavioral promises.
  - V2-006 execution or migration.
proposed_contract_not_implemented:
  vocabulary: [repo_read, repo_write, command]
  ownership: Logical workflow state; every rung inherits that state's policy.
  transport: Optional immutable canonical-order capability tuple on ExecutionBinding; no duplicate StageInvocation field.
  omission: Proposed legacy compatibility mode; canonical model states would declare explicit capabilities.
  deterministic_commands: Proposed rejection of model-tool capability declarations for command-provider states; terminal declarations also rejected.
audit_2026_10_03:
  claude:
    version: 2.1.282
    executable: Discovered using local PATH; no machine path added to workflow YAML.
    confirmed_help:
      tools: Explicit built-in tool list; empty string disables all tools.
      allowed_tools: Tool permission allowlist; necessary to distinguish tool availability from permission to execute.
      restricted: Removes code-running tools unless explicitly named by --tools; confines file tools to working directories.
      permission_prompts_none: Actions that would prompt are denied; permission mode still governs other actions.
    proposed_mapping:
      repo_read: [Read, Glob, Grep]
      repo_write: [Edit, Write]
      command: [Bash]
    limitation: Bash availability alone is not proof of command permission or filesystem/network containment. No permission expansion was implemented.
  codex:
    version: 0.157.0
    existing_adapter: Uses exec with workspace-write sandbox, never approvals, ignored user config/rules and configured cwd.
    confirmed_help:
      sandbox: read-only, workspace-write and danger-full-access select sandbox policy for model-generated shell commands.
      config: Explicit TOML configuration overrides are supported.
      shell_tool: Installed stable feature, currently true; documented as enabling the default shell tool.
      unified_exec: Installed stable feature, currently true; documented as selecting PTY-backed execution.
    blocker: |
      The audited supported CLI/config interface does not establish an independent
      repository read/search capability with command execution disabled. read-only
      is a filesystem sandbox for commands, not a command-tool deny policy. Keeping
      shell enabled to implement repo_read would silently grant command. Disabling
      shell_tool does not establish an alternative supported repository read/search
      tool through this CLI boundary. Absence of a documented mapping is not proof
      that no internal or future implementation could supply it; it is insufficient
      evidence to promise the requested contract in Switchyard today.
    rejected_approximation: Map repo_read to read-only while leaving shell commands enabled.
    next_requirement: |
      Establish an audited provider-native non-command read/search mechanism and
      independent tool controls, or explicitly revise the generic contract to
      acknowledge coupled read/command access. Do not invent flags, enable MCP,
      silently broaden permissions or implement a new execution backend here.
  official_sources:
    - https://learn.chatgpt.com/docs/config-file/config-reference
    - https://learn.chatgpt.com/docs/security
  source_scope: Configuration reference confirms shell_tool and unified_exec controls; local CLI help confirms sandbox semantics. No live capability call occurred.
