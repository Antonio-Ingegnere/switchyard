resume_capability_audit_2026_10_03:
  rung_outcome_prerequisite: Resolved by V2-001E, commit 95820cb; no further outcome changes needed.
  blocker: Canonical Claude REPRODUCE has no tool for running the required independent reproduction command.
  classification: Provider adapter tool capability/configuration.
  evidence:
    canonical_binding: {state: REPRODUCE, provider: claude, profile: claude-haiku, model: haiku, effort: medium}
    consumes: [request, bug_spec]
    produces: [reproduction_evidence]
    adapter: switchyard/provider_stages.py, ClaudeStageExecutor.run
    configured_tools: [Read, Edit, Write, Glob, Grep]
    mcp: Disabled through strict empty MCP configuration and disallowed mcp__* tools.
    command_tool: Bash is absent from the explicit tool allowlist.
    documented_policy: docs/design/provider-stages.md and V2-004 MicroSpec retain restricted file tools.
  consequence: |
    Claude can inspect source and tests but cannot execute the independently required
    reproduction. A later command VERIFY cannot establish that REPRODUCE performed
    its own run. Harness baseline output or fake-process execution cannot substitute
    for this live acceptance requirement.
  smallest_focused_fix: |
    A separate provider-layer capability slice must define and verify a bounded,
    explicit project-command execution policy sufficient for the reproducer. Audit
    the installed CLI permission mechanism and cover it offline. Do not silently
    expand the existing file-only policy or add a harness callback to run commands
    on behalf of REPRODUCE. Runtime, outcome restrictions and canonical routing do
    not need changes for this blocker.
  scope_reason: V2-006 non_goals explicitly exclude provider permission expansion inside dogfood.
  live_part_a_attempts: 0
  live_part_b_attempts: 0
  provider_calls: 0
  implementation: No fixture, harness, example workflow, provider, compiler or runtime changes made in this resume.
  completion: V2-006 remains incomplete; no success commit. Stop pending the focused capability fix.

