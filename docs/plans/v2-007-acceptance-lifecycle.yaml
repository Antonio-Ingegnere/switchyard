  full_suite: 525 tests; 523 passed; one unchanged known synthetic SIGKILL failure; one existing Windows platform skip; zero new failures.
  environment: TERM=dumb
  known_failure: test_codex_repair.CodexRepairTests.test_exact_prompts_real_fake_cli_and_fresh_inputs, existing synthetic 4096-NUL case.
  existing_skip: test_command.CommandTests.test_windows_batch_executables_rejected, Windows batch-path validation.
  coverage: Complete discovery includes V2-006, V2-005, V2-004A/B/C/D/E, V2-003A/B/C/D/E, V2-002, V2-001E/F, loader/compiler, RUNTIME-V2, V1, observability and DELIVERY-001.
  focused_log: /tmp/switchyard-v2-007-focused-final.log
  full_suite_log: /tmp/switchyard-v2-007-full-suite.log
  recovery_regression: Unverifiable publication raises LifecycleRecoveryRequired; durable prepared intent blocks replay without claiming HEAD stayed unchanged.
  microspec: Existing strict MicroSpec validator passed.
  scope: Runtime/Event, canonical workflows, V2-006 history and Adeo untouched; no live provider calls; no machine-local configuration committed.
