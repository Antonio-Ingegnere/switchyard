id: V2-004E
goal: |
  Accept Claude structured output that omits nullable StageResult keys by normalizing
  omission to explicit null at the Claude adapter boundary, without weakening the
  canonical provider-neutral StageResult contract.
status: complete
scope:
  - switchyard/provider_stages.py transport-aware result_schema, CLAUDE_TRANSPORT_REQUIRED, normalize_claude_transport and ClaudeStageExecutor wiring.
  - tests/test_claude_transport_normalization.py; expectation updates in tests/test_structured_output_alignment.py and tests/test_stage_output_contract.py.
  - docs/design/provider-stages.md; docs/plans/v2-006-bugfix-dogfood.yaml V2-004E record.
constraints:
  - Canonical StageResult and parse_stage_result remain strict four-key validation.
  - Codex schema and adapter unchanged; no normalization for Codex.
  - Only missing nullable keys are normalized; no synthesis, stripping or coercion.
  - Normalization only on the successful Claude decoding path; nonzero exits stay ProviderExecutionError.
  - MAX_STRUCTURED_OUTPUT_RETRIES=1; no Switchyard retry; no undocumented Claude feature gates.
  - No model/profile/effort/capability/runtime/Event/compiler/budget/context/artifact/workflow change.
  - No live provider calls; Adeo untouched.
acceptance:
  - Claude transport schema requires outcome and produced_artifacts and declares all four properties unchanged.
  - Canonical and Codex schemas require all four keys.
  - Claude omissions of handoff and/or diagnostics normalize to null and parse; explicit values are preserved.
  - Missing outcome or produced_artifacts, extra keys and invalid nullable values still fail.
  - Generic parser and Codex still reject omitted nullable keys.
  - Replay of the Part A attempt 3 TRIAGE shape commits a legal bug_spec through the canonical ContextualExecutor.
  - Full offline suite has zero new failures beyond the known SIGKILL failure and platform skip.
verification:
  - tests/test_claude_transport_normalization.py (9 offline tests).
  - Groups V2-004D, V2-004C, V2-004B, V2-004/A, V2-003A/B/C, V2-002, V2-005, V2-006 offline, loader/compiler/runtime, V1, observability, DELIVERY-001 and full discovery under TERM=dumb.
non_goals:
  - Enabling tengu_structured_output_strict or any internal Claude feature gate.
  - Moving TRIAGE or any stage off Haiku; retry-policy changes.
  - Changing permissions, tools or restricted mode (attempt 2 Read denial remains historical).

limitation_accommodated: |
  Claude Code 2.1.282 implements --json-schema as a StructuredOutput tool whose input
  is generated by the model and validated afterwards; strict required-field enforcement
  is an internal gate. In V2-006 Part A attempts 2 and 3 (TRIAGE, claude-haiku, haiku,
  medium, [repo_read]) the input lacked null-valued handoff and diagnostics, even after
  V2-004D made the instructions explicit. Omission versus CLI null-dropping is not
  observable from retained evidence and does not affect the adapter contract.

contracts:
  canonical: All four keys required; handoff and diagnostics values nullable. Used by the parser, the rendered prompt and Codex.
  claude_transport: Same properties; required only outcome and produced_artifacts.
  equivalence: For nullable keys, missing and explicit null both mean no value supplied.

api:
  RESULT_FIELDS: Unchanged metadata; Claude transport requirement derived as nullable == false, which is exactly the provider rule.
  CLAUDE_TRANSPORT_REQUIRED: "('outcome', 'produced_artifacts')"
  result_schema: "result_schema(contract=None, transport='canonical'); 'claude' replaces only required; unknown transport raises ValueError."
  normalize_claude_transport: Pure helper; non-dict input returned unchanged; dict copied with absent nullable keys set to None.
  ClaudeStageExecutor: Sends result_schema(contract, 'claude'); after the success-envelope check, parse_stage_result(normalize_claude_transport(structured_output)).
  CodexStageExecutor: Unchanged; canonical schema and strict parse.

algorithm: |
  1. Existing decoding of the Claude envelope and success checks.
  2. If structured_output is a JSON object, copy it and add handoff=null and/or
     diagnostics=null only when the key is absent.
  3. Pass the result unchanged otherwise to the canonical exact-key parser.

expectation_updates:
  - test_stage_output_contract cross-provider test now compares Claude to the claude transport schema; Codex still to canonical.
  - test_structured_output_alignment omitted-key rejection now targets Codex; shared-renderer test asserts identical properties with only Claude's required list differing.

implementation_result:
  new_tests: 9 passed.
  groups: |
    V2-004D 7, V2-004C 14, V2-004B 6, V2-004/A 16, V2-003A/B/C 41, V2-002 19, V2-005 4,
    V2-006 offline 5, loader/compiler/runtime 141, observability 71, DELIVERY-001 43:
    all OK. V1 93: only the known SIGKILL failure plus the existing platform skip.
  full_offline: 469 tests under TERM=dumb with uncommitted V2-006 work present; 467 passed, 1 unchanged known local SIGKILL failure, 1 existing platform skip; zero new failures.
  provider_calls: 0
  protected_scope: Runtime/Event, compiler, workflows, profiles, capabilities, budgets, context, artifact persistence and Adeo untouched.
  limitation: Accepting omission does not guarantee other Haiku output is valid; any other nonconformance remains an explicit execution failure.
