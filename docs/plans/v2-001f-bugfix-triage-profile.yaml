  and diagnosis with comparatively simple outputs, and Sonnet for contract-heavy
  specification stages producing complete structured semantic artifacts. TRIAGE
  produces a strict bug_spec MicroSpec and therefore now uses Sonnet, like existing
  SPECIFY_FIX and FEATURE SPECIFY. Accumulated dogfood evidence supports changing
  TRIAGE without promoting the successful Haiku investigation stages. This is a
  configuration choice, not a new DSL/framework rule or a guarantee of model quality.
