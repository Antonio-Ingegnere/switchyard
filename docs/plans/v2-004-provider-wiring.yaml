id: V2-004
goal: Resolve V2 stage bindings to bounded provider and deterministic command backends.
status: complete
scope:
  - ClaudeStageExecutor, CodexStageExecutor and CommandStageExecutor below ContextualExecutor.
  - One shared bounded process helper reusing existing process validation/read/cleanup utilities.
  - Strict shared StageResult protocol, renderer, local config and profile resolver.
constraints:
  - Runtime, Event, V1 adapters, compiler, workflow graphs, budgets and context selection unchanged.
  - One process per stage; no adapter retries, escalation or artifact/handoff persistence.
  - No real provider calls in mandatory tests; no Adeo changes.
acceptance:
  - Exact requested model and explicit meaningful effort translation at provider boundary.
  - Reliable supported structured channels, bounded logs and explicit transport failures.
  - Declarative command exit mapping and capture on every normal exit.
  - Canonical fake-process feature and bugfix escalation paths preserve durable artifacts and handoffs.
verification:
  - Local Claude and Codex --version/--help plus official protocol documentation audit.
  - Focused fake-process argument, parsing, timeout, cancellation, capture and integration tests.
  - V2 command/schema/context/workspace/compiler and complete offline regression suite.
non_goals:
  - Provider billing, provider sessions, workflow changes, Adeo migration or V2-005.
prior_command_blocker:
  status: resolved_by_V2-001D
  mapping: Immutable ExecutionProfile.command supplies argv, exit outcomes and bounded capture.
  remaining_command_configuration_prerequisites: []
existing_adapter_audit:
  codex: Existing CodexExecutor wraps CommandExecutor, renders WorkUnit and bounded diagnostics, maps nonzero to error.
  claude: Existing ClaudeExecutor wraps CommandExecutor with restricted tools and text output; rejects diagnostic input.
  command: Existing CommandExecutor provides shell-free cwd/timeout execution and optional 4096-byte merged diagnostic tail.
  reuse: |
    Existing adapters consume InvocationRequest, not StageInvocation. V2 reuses their
    generic helpers without changing them; full structured-output and separate-channel
    retention are implemented once for all V2 adapters. Nonzero command semantic mapping
    remains separate from provider failure normalization. No cancellation API is added.
implementation_audit_2026_09_29:
  local_cli: Claude Code 2.1.282 and codex-cli 0.157.0; inspected --version/--help only, no model requests.
  sources:
    - https://code.claude.com/docs/en/headless
    - https://code.claude.com/docs/en/model-config
    - https://code.claude.com/docs/en/env-vars
    - https://developers.openai.com/codex/config-reference
    - https://developers.openai.com/codex/noninteractive
  claude: |
    --print reads noninteractive stdin; --model selects exact alias/ID. --output-format
    json plus --json-schema returns one result envelope with structured_output. Parse
    that object only, never human result text. Nonzero exit or is_error is failure.
    Retain restricted file tools, acceptEdits and permission-prompts none; add safe-mode
    and strict MCP isolation. No resume/continue session flags. cwd is subprocess cwd.
    Sonnet low/medium/high maps directly to --effort. Haiku lacks native effort; use
    documented extended thinking MAX_THINKING_TOKENS with explicit adapter policy
    low=1024, medium=8192, high=16384 and max output 32768 to prevent clamping.
    This is a thinking-budget translation, not a claim Haiku supports native effort.
    MAX_STRUCTURED_OUTPUT_RETRIES=1 permits only the first structured-output attempt.
    CLI-managed transport retries/tool turns may occur within this one bounded process;
    the adapter adds no retry and no escalation.
  codex: |
    --model passes binding.model unchanged. -c model_reasoning_effort="low|medium|high"
    selects effort. exec '-' reads stdin; --output-schema constrains final response;
    --output-last-message isolates it in a temporary file. stdout/stderr are operational
    logs, never parsed as semantic output. Retain ephemeral, ignore-user-config,
    ignore-rules, workspace-write and approval never; cwd and --cd specify project root.
    Supported model IDs are explicitly declared in local config, not silently aliased.
    The example model name codex is a logical sample; real deployments must use an
    available model ID and declare that exact ID locally. Tests declare their fake ID.
  transport: |
    One shared V2 bounded process helper reuses existing Command validation,
    _stop_and_wait, _read_chunk and diagnostic normalization without modifying runtime.
    One process per stage, shell=False, file-backed bounded stdin and nonblocking
    bounded pipe retention. Timeout/spawn/signal failure raises ProviderExecutionError;
    no default semantic outcome applies. Cleanup kills/waits the direct child, preserving
    existing limits (not a process-tree cancellation guarantee). Interrupts propagate.
  command: |
    Resolve argv[0] once using explicit environment PATH or configured cwd for relative
    paths, preserving all arguments. Nonnegative process exit maps through declared
    codes/default. Capture stdout, stderr or merged OS pipe for combined (observed pipe
    order, not an invented temporal order). Every normal exit produces evidence when
    configured. Retain UTF-8-safe normalized tail; '=' complete or '!' truncated prefix
    counts inside max_bytes, including tiny limits. No handoff. No LLM JSON required.
  result_protocol: |
    Strict JSON object with exactly outcome, produced_artifacts, handoff, diagnostics.
    Artifact items have exactly name/content. Handoff is null or StageHandoff's six
    body fields. Diagnostics is null or UTF-8 string <=4096 bytes, converted to the
    existing DiagnosticPayload. Reject duplicate keys/names, nonfinite numbers,
    malformed types and unknown fields. ContextualExecutor still validates durable
    contracts; runtime remains authoritative for transition membership.
  rendering: |
    One deterministic renderer includes binding, selected artifact metadata/content,
    optional advisory previous handoff, bounded diagnostic input, and result schema.
    No manifest/history reads or provider-native session IDs. Structured JSON sections
    keep input content separate from output instructions.
  api: |
    ProviderRuntimeConfig(working_directory, claude_executable=None,
    codex_executable=None, environment=None, timeout_seconds=600,
    max_result_bytes=1048576, codex_models=()). Environment is snapshotted; explicit
    mapping replaces inheritance. Codex model allowlist is local availability declaration,
    not a model alias map. Claude supports audited haiku/sonnet aliases and pinned
    Haiku 4.5/Sonnet 4.6 identifiers; other models fail explicitly.
    ProviderStageExecutorResolver(profiles, runtime_config) accepts bundle.profiles,
    resolves each binding eagerly and returns ClaudeStageExecutor, CodexStageExecutor,
    or CommandStageExecutor. Missing executables/models fail during compilation.
  no_remaining_dsl_gap: true
  boundaries: No runtime/Event, context selection, artifact contracts or workflow changes.
verification_result:
  focused_provider_tests: 12 passed (fake executable processes only).
  full_offline_suite: 405 tests, 404 passed, 1 existing platform skip; 28.316 seconds.
  local_provider_execution: Help/version queries only; no authenticated model requests.
  runtime_event_workflows: Unchanged.
  adeo: Untouched.
  remaining_dsl_prerequisites: []
  limitations:
    - No live authentication/model-quality smoke test; account availability is deployment-owned.
    - Codex model IDs require explicit local declaration; the sample codex ID is not a public alias promise.
    - Haiku effort is translated to thinking budgets, not silently passed to an unsupported native dial.
    - Direct-child cleanup and retained-output limits do not guarantee process-tree cancellation or a disk quota.

model_resolution_correction_V2_004A:
  supersedes: Original exact-ID and codex_models allowlist policy in the historical audit above.
  api: 'ProviderRuntimeConfig(..., model_aliases: Mapping[str, Mapping[str, str]] = {})'
  algorithm: Explicit provider/selector mapping first; otherwise pass the selector unchanged.
  inspection: Binding.model remains workflow intent; model stage executors expose resolved_model.
  allowlist: Removed codex_models; no model cache membership checks or cache reads.
  validation: |
    Validate mapping types and nonempty/NUL-free strings, executable availability,
    provider support and supported effort translation. Claude effort follows the
    concrete resolved model; unknown concrete models with requested effort fail
    explicitly. Compilation is not an authenticated model capability check.
  invocation: Provider rejection raises an execution failure; no substitution or alternate-model retry.
  boundaries: Compiler remains eager; runtime, Event, canonical YAML and context unchanged.
