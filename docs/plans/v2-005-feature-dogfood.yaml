  classification: Structured-output protocol / context transport defect.
  evidence_analysis: |
    Claude returned parseable structured StageResult content, but its artifact name
    spec.md is not SPECIFY's declared produces name microspec. Artifact validation
    correctly refused it before persistence. StageInvocation carries binding, consumed
    snapshots, prior handoff and diagnostics, but no declared output contract. The
    renderer supplies a generic JSON envelope with arbitrary artifact-name/outcome
    strings, not allowed output names, format/schema requirements, MicroSpec required
    fields or state outcomes. The real executor therefore lacks the contract that
    offline fake executors were explicitly programmed to satisfy.
  smallest_followup: |
    A focused V2 application/context and provider-rendering correction should expose
    immutable declared stage output contracts (outcomes and produced artifact
    definitions, including the existing MicroSpec contract) to the stage executor.
    Render that contract while retaining existing validation and runtime authority.
    Do not rename model output, weaken validation or add instructions in the dogfood
    fixture/runner as a workaround. No such fix is implemented in V2-005.
