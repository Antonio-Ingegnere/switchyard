id: V2-005
goal: Prove the canonical FEATURE workflow against a disposable project using live Claude.
status: complete
scope:
  - A tiny dependency-free catalog fixture with independent failing feature acceptance tests.
  - A reusable application entrypoint composing workspace, resolvers, compiler and runtime.
  - Offline fake-provider integration and an explicit manual live dogfood entrypoint.
constraints:
  - Agents modify only a disposable target, never the active Switchyard repository.
  - Use the unchanged canonical feature flow and its real deterministic command verifier.
  - No model substitution, skipped bindings, runner retries or manual output repair.
  - Stop on a framework or canonical configuration blocker; do not work around it here.
  - No Adeo changes, provider session transfer or V2-006 work.
acceptance:
  - Baseline fails only for the independently specified case-insensitive lookup feature.
  - Real SPECIFY commits a valid MicroSpec and structured handoff without rewriting request.md.
  - Real IMPLEMENT consumes durable inputs and modifies intended disposable project files.
  - The canonical verifier passes, commits evidence and reaches READY_FOR_MANUAL_QA.
  - Offline integration and the full existing suite pass.
verification:
  - Canonical compilation preflight using installed executables and local model configuration.
  - Planned offline fake-process runner integration followed by the complete offline suite.
  - Exactly one live workflow attempt after prerequisites pass, with no harness retries.
non_goals:
  - Real Codex escalation proof, framework fixes, workflow changes or target commits/pushes.
planned_design:
  runner: |
    execute_v2_workflow(bundle, flow_name, request, work_root, provider_runtime_config,
    recorder=None) returns a frozen WorkflowExecution containing RunResult,
    WorkWorkspace and CompiledWorkflow. It only composes existing APIs.
  fixture: |
    Copy tests/fixtures/feature_dogfood_project to a retained temporary target.
    A catalog lookup preserves case-sensitive defaults and adds optional
    case-insensitive exact matching. Tests use only unittest and the standard library.
  request: |
    I want catalog lookups to optionally ignore capitalization.

    The current lookup behavior must continue working as it does now.
    Add the new behavior cleanly and cover it with tests.
  baseline: |
    Check that existing case-sensitive behavior passes and the named independent
    case-insensitive acceptance test fails for the missing behavior. Reject an
    unexpectedly green baseline or unrelated failure before invoking any provider.
  provider_path: |
    Canonical SPECIFY and IMPLEMENT select claude-sonnet / sonnet / medium.
    ProviderStageExecutorResolver is wrapped by workspace_resolver, then compiled
    and run through the existing runtime. No provider-native session continuation.
  verifier: python3 -m unittest discover -s tests
  retained_evidence: |
    Keep target and work directories, canonical event JSONL, source-file change
    inventory and a concise report on success or failure. Do not retain/dump
    complete provider transcripts in the work contract.
