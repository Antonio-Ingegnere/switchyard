    execute_v2_workflow(bundle, flow_name, request, work_root, provider_runtime_config,
    recorder=None) would return a frozen WorkflowExecution containing RunResult,
    WorkWorkspace and CompiledWorkflow. It would only compose existing APIs.
    No runner or fixture code has been implemented while the preflight is blocked.
  fixture: |
    Copy tests/fixtures/feature_dogfood_project to a retained temporary target.
    A catalog lookup preserves case-sensitive defaults and adds optional
    case-insensitive exact matching. Tests use only unittest and the standard library.
  request: |
    I want catalog lookups to optionally ignore capitalization.

    The current lookup behavior must continue working as it does now.
    Add the new behavior cleanly and cover it with tests.
  baseline: |
    Check that existing case-sensitive behavior passes and the named independent
    case-insensitive acceptance test fails for the missing behavior. Reject an
    unexpectedly green baseline or unrelated failure before invoking any provider.
  provider_path: |
    Canonical SPECIFY and IMPLEMENT select claude-sonnet / sonnet / medium.
    ProviderStageExecutorResolver is wrapped by workspace_resolver, then compiled
    and run through the existing runtime. No provider-native session continuation.
  verifier: python3 -m unittest discover -s tests
  retained_evidence: |
    Keep target and work directories, canonical event JSONL, source-file change
    inventory and a concise report on success or failure. Do not retain/dump
    complete provider transcripts in the work contract.
