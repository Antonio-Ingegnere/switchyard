# Descriptive only: V2-001A does not compile or execute this bundle.
version: 2
profiles:
  claude-haiku:
    provider: claude
    model: haiku
  claude-sonnet:
    provider: claude
    model: sonnet
  codex:
    provider: codex
    model: codex
  command:
    provider: command
roles:
  specifier:
    primary: {profile: claude-sonnet, effort: medium}
  triager:
    primary: {profile: claude-haiku, effort: medium}
  reproducer:
    primary: {profile: claude-haiku, effort: medium}
  diagnostician:
    primary:
      profile: claude-haiku
      effort: medium
      budget: {max_invocations: 1}
    escalation:
      - kind: vertical
        on: [inconclusive, budget_exceeded]
        profile: claude-sonnet
        effort: high
        context: continue
        budget: {max_invocations: 1}
      - kind: horizontal
        on: [inconclusive, diagnosis_disproved, verification_same_failure]
        profile: codex
        effort: high
        context: fresh
        budget: {max_invocations: 1}
  rediagnostician:
    primary: {profile: codex, effort: high}
  implementer:
    primary: {profile: claude-sonnet, effort: medium}
  fixer:
    primary: {profile: claude-sonnet, effort: medium}
  verifier:
    primary: {profile: command}
flows:
  feature:
    entry: SPECIFY
    run_budget: {max_invocations: 10, on_exceeded: NEEDS_HUMAN}
    states:
      SPECIFY:
        role: specifier
        budget: {max_invocations: 1, max_state_visits: 1, on_exceeded: NEEDS_HUMAN}
        consumes: [request]
        produces: [microspec]
        on: {ready: IMPLEMENT, needs_clarification: NEEDS_HUMAN}
      IMPLEMENT:
        role: implementer
        budget: {max_invocations: 1, max_state_visits: 1, on_exceeded: NEEDS_HUMAN}
        consumes: [request, microspec]
        produces: [implementation_handoff]
        on: {ready: VERIFY, blocked: NEEDS_HUMAN}
      VERIFY:
        role: verifier
        budget: {max_invocations: 1, max_state_visits: 1, on_exceeded: NEEDS_HUMAN}
        consumes: [microspec, implementation_handoff]
        produces: [verifier_evidence]
        on: {pass: READY_FOR_MANUAL_QA, fail: DIAGNOSE_FAILURE}
      DIAGNOSE_FAILURE:
        role: diagnostician
        budget: {max_invocations: 3, max_state_visits: 1, on_exceeded: NEEDS_HUMAN}
        escalation_exhausted: NEEDS_REDIAGNOSIS
        consumes: [microspec, implementation_handoff, verifier_evidence]
        produces: [failure_diagnosis]
        on: {ready: REPAIR_ONCE, inconclusive: NEEDS_REDIAGNOSIS, needs_clarification: NEEDS_HUMAN}
      REPAIR_ONCE:
        role: fixer
        budget: {max_invocations: 1, max_state_visits: 1, on_exceeded: NEEDS_HUMAN}
        consumes: [microspec, verifier_evidence, failure_diagnosis]
        produces: [implementation_handoff]
        on: {ready: VERIFY_AGAIN, blocked: NEEDS_REDIAGNOSIS}
      VERIFY_AGAIN:
        role: verifier
        budget: {max_invocations: 1, max_state_visits: 1, on_exceeded: NEEDS_HUMAN}
        consumes: [microspec, implementation_handoff]
        produces: [verifier_evidence]
        on: {pass: READY_FOR_MANUAL_QA, fail: NEEDS_REDIAGNOSIS}
      READY_FOR_MANUAL_QA: {terminal: true}
      NEEDS_REDIAGNOSIS: {terminal: true}
      NEEDS_HUMAN: {terminal: true}
  bugfix:
    entry: TRIAGE
    run_budget: {max_invocations: 14, on_exceeded: NEEDS_HUMAN}
    states:
      TRIAGE:
        role: triager
        budget: {max_invocations: 1, max_state_visits: 1, on_exceeded: NEEDS_HUMAN}
        consumes: [request]
        produces: [triage]
        on: {ready: REPRODUCE, needs_clarification: NEEDS_HUMAN}
      REPRODUCE:
        role: reproducer
        budget: {max_invocations: 1, max_state_visits: 1, on_exceeded: NEEDS_HUMAN}
        consumes: [request, triage]
        produces: [reproduction_evidence]
        on: {ready: DIAGNOSE, inconclusive: NEEDS_HUMAN}
      DIAGNOSE:
        role: diagnostician
        budget: {max_invocations: 3, max_state_visits: 1, on_exceeded: NEEDS_HUMAN}
        escalation_exhausted: NEEDS_HUMAN
        consumes: [request, reproduction_evidence]
        produces: [failure_diagnosis]
        on: {ready: SPECIFY_FIX, inconclusive: NEEDS_HUMAN}
      SPECIFY_FIX:
        role: specifier
        budget: {max_invocations: 1, max_state_visits: 1, on_exceeded: NEEDS_HUMAN}
        consumes: [request, reproduction_evidence, failure_diagnosis]
        produces: [microspec]
        on: {ready: FIX, needs_clarification: NEEDS_HUMAN}
      FIX:
        role: fixer
        budget: {max_invocations: 1, max_state_visits: 1, on_exceeded: NEEDS_HUMAN}
        consumes: [microspec, failure_diagnosis]
        produces: [implementation_handoff]
        on: {ready: VERIFY, blocked: NEEDS_HUMAN}
      VERIFY:
        role: verifier
        budget: {max_invocations: 1, max_state_visits: 1, on_exceeded: NEEDS_HUMAN}
        consumes: [microspec, reproduction_evidence, implementation_handoff]
        produces: [verifier_evidence]
        on: {pass: READY_FOR_MANUAL_QA, fail: REDIAGNOSE}
      REDIAGNOSE:
        role: rediagnostician
        budget: {max_invocations: 1, max_state_visits: 1, on_exceeded: NEEDS_HUMAN}
        consumes: [request, reproduction_evidence, verifier_evidence, failure_diagnosis]
        produces: [revised_diagnosis]
        on: {ready: REFIX, inconclusive: NEEDS_HUMAN}
      REFIX:
        role: fixer
        budget: {max_invocations: 1, max_state_visits: 1, on_exceeded: NEEDS_HUMAN}
        consumes: [microspec, revised_diagnosis, verifier_evidence]
        produces: [implementation_handoff]
        on: {ready: VERIFY_AGAIN, blocked: NEEDS_HUMAN}
      VERIFY_AGAIN:
        role: verifier
        budget: {max_invocations: 1, max_state_visits: 1, on_exceeded: NEEDS_HUMAN}
        consumes: [microspec, reproduction_evidence, implementation_handoff]
        produces: [verifier_evidence]
        on: {pass: READY_FOR_MANUAL_QA, fail: NEEDS_HUMAN}
      READY_FOR_MANUAL_QA: {terminal: true}
      NEEDS_HUMAN: {terminal: true}
